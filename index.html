        // 解析年份資料
        const processedData = rawData.map(comp => {
            const years = comp.rounds.map(r => {
                const match = r.date.match(/\d{4}/);
                return match ? parseInt(match[0], 10) : 0;
            }).filter(y => y > 0);

            return {
                ...comp,
                totalRounds: comp.rounds.length,
                latestYear: years.length > 0 ? Math.max(...years) : 0
            };
        }).filter(comp => comp.latestYear > 0);

        // 渲染圖表
        function renderCharts(segmentFilter = 'ALL') {
            chartInstances.forEach(inst => inst.dispose());
            chartInstances = [];

            const container = document.getElementById('charts-container');
            container.innerHTML = '';

            let filteredData = processedData;
            if (segmentFilter !== 'ALL') {
                filteredData = processedData.filter(d => d.segment && d.segment.includes(segmentFilter));
            }

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="chart-card text-center py-16 text-slate-400 text-lg font-medium">
                        🔍 尚無符合「${segmentFilter}」分類的公司融資紀錄
                    </div>
                `;
                return;
            }

            const years = Array.from(new Set(filteredData.map(d => d.latestYear))).sort((a, b) => b - a);

            years.forEach(year => {
                const companies = filteredData.filter(d => d.latestYear === year);
                companies.sort((a, b) => b.totalRounds - a.totalRounds);

                const card = document.createElement('div');
                card.className = 'chart-card';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-2xl font-bold text-slate-800 flex items-center">
                            <span class="w-2 h-8 bg-blue-600 mr-3 rounded-full"></span>
                            最新募資年份：${year} 年 (${segmentFilter === 'ALL' ? '全部重點產業' : segmentFilter})
                        </h2>
                        <span class="text-slate-400 text-sm font-medium">梯隊企業：${companies.length} 家</span>
                    </div>
                    <div id="chart-${year}" class="chart-instance"></div>
                `;
                container.appendChild(card);

                const myChart = echarts.init(document.getElementById(`chart-${year}`));
                chartInstances.push(myChart);

                const option = {
                    grid: { top: '10%', left: '5%', right: '5%', bottom: '15%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: companies.map(c => c.company),
                        axisLabel: { interval: 0, rotate: 15, color: '#475569', fontWeight: 600, fontSize: 13 },
                        axisLine: { lineStyle: { color: '#e2e8f0' } }
                    },
                    yAxis: {
                        type: 'value',
                        name: '歷年總融資次數',
                        minInterval: 1,
                        splitLine: { lineStyle: { color: '#f1f5f9' } }
                    },
                    tooltip: {
                        trigger: 'axis',
                        enterable: true,   // ⭐ 關鍵設定 1：允許滑鼠滑入 Tooltip 內上下滾動
                        confine: true,     // ⭐ 關鍵設定 2：強制將 Tooltip 限制在圖表區域內
                        axisPointer: { type: 'shadow' },
                        backgroundColor: '#ffffff',
                        padding: 0,
                        borderWidth: 0,
                        shadowBlur: 20,
                        shadowColor: 'rgba(0,0,0,0.15)',
                        formatter: function(params) {
                            const compName = params[0].name;
                            const comp = filteredData.find(c => c.company === compName);
                            let html = `<div class="tooltip-box"><div class="tooltip-title">${compName}</div>`;
                            
                            html += `<div class="mb-3 text-sm font-black text-blue-600 flex items-center gap-2">
                                        <span>累計 ${comp.totalRounds} 輪募資紀錄</span>
                                        <span class="tag tag-segment">[${comp.segment}]</span>
                                        ${comp.isUnicorn ? '<span class="unicorn-badge">獨角獸</span>' : ''}
                                     </div>`;
                            
                            // 提示使用者可以點擊查看完整歷史
                            html += `<div class="text-[11px] text-blue-500 font-bold mb-3 bg-blue-50 p-1.5 rounded text-center">
                                        👇 點擊柱狀圖可開啟完整歷史明細大視窗
                                     </div>`;
                            
                            comp.rounds.forEach((r, idx) => {
                                const isLatest = idx === 0;
                                html += `
                                    <div class="round-item ${isLatest ? 'latest' : ''}">
                                        <div class="round-dot"></div>
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="tag tag-round">${r.round}</span>
                                            <span class="tag tag-date">${r.date}</span>
                                        </div>
                                        <div class="text-xs text-slate-700 font-bold">金額/估值：${r.amount}</div>
                                        <div class="text-[11px] text-slate-500 mt-0.5 leading-relaxed">投資方：${r.investors}</div>
                                    </div>
                                `;
                            });
                            html += `</div>`;
                            return html;
                        }
                    },
                    series: [{
                        type: 'bar',
                        barWidth: '32%',
                        data: companies.map(c => c.totalRounds),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#3b82f6' },
                                { offset: 1, color: '#1d4ed8' }
                            ]),
                            borderRadius: [8, 8, 0, 0]
                        },
                        emphasis: { itemStyle: { color: '#1e3a8a' } }
                    }]
                };

                myChart.setOption(option);

                // ⭐ 綁定柱狀圖點擊事件 ➔ 開啟彈窗 Modal
                myChart.on('click', function(params) {
                    if (params.name) {
                        openModal(params.name);
                    }
                });
            });
        }

        // 彈窗 Modal 開啟邏輯
        function openModal(compName) {
            const comp = processedData.find(c => c.company === compName);
            if (!comp) return;

            document.getElementById('modal-company-name').innerText = comp.company;
            document.getElementById('modal-segment-tag').innerText = `[${comp.segment}]`;
            document.getElementById('modal-subtitle').innerText = `共累計 ${comp.totalRounds} 輪募資紀錄歷史時間軸 (由新到舊)`;

            const unicornTag = document.getElementById('modal-unicorn-tag');
            if (comp.isUnicorn) {

            } else {
                unicornTag.classList.add('hidden');
            }

            const listContainer = document.getElementById('modal-rounds-list');
            let html = '';

                html += `
                    <div class="relative pl-6 pb-2 border-l-2 ${isLatest ? 'border-blue-500 bg-blue-50/50 p-4 rounded-xl border-l-4' : 'border-slate-200'}">
                        <div class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full ${isLatest ? 'bg-blue-600 ring-4 ring-blue-100' : 'bg-slate-300'}"></div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2.5 py-1 bg-blue-100 text-blue-800 rounded-md font-bold text-xs">${r.round}</span>
                            <span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md font-bold text-xs">${r.date}</span>
                            ${isLatest ? '<span class="text-xs bg-blue-600 text-white font-bold px-2 py-0.5 rounded-md">最新一輪</span>' : ''}
                        </div>
                        <div class="text-sm font-bold text-slate-800 mb-1">
                            💰 融資金額/估值：<span class="text-blue-600 font-black">${r.amount}</span>
                        </div>
                        <div class="text-xs text-slate-600 leading-relaxed bg-white p-3 rounded-lg border border-slate-100 mt-2">
                            🤝 投資方：<span class="font-bold text-slate-700">${r.investors}</span>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // 防止背景滾動
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function handleBackdropClick(event) {
            if (event.target.id === 'detail-modal') {
                closeModal();
            }
        }

        // Tab 切換邏輯
        function filterSegment(seg) {
            currentSegment = seg;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            const activeBtn = document.getElementById(`tab-${seg}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }

            renderCharts(seg);
        }

        // 按下 ESC 鍵自動關閉彈窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 初始化第一次渲染
        renderCharts('ALL');

        window.addEventListener('resize', () => {
            chartInstances.forEach(inst => inst.resize());
        });
    </script>
</body>
</html>
